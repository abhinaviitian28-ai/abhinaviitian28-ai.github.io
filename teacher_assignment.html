<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teacher Assignment Portal - SSKL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: #070d19; 
      min-height: 100vh; 
      color: #ffffff; 
      padding: 14px 10px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      position: relative; 
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 75%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 760px;
      animation: softFadeIn 0.25s ease-out;
    }

    @keyframes softFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.75);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #38bdf8;
    }

    .brand i {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 7px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      flex-shrink: 0;
    }

    .btn-dashboard {
      text-decoration: none;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 7px 12px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-dashboard:hover { background: rgba(56, 189, 248, 0.25); }

    /* Card Containers */
    .card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 10.5px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #38bdf8;
    }

    .form-textarea {
      resize: vertical;
      min-height: 65px;
    }

    /* Date row with quick offset pills */
    .date-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .date-pills {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .pill-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn:hover { background: rgba(56, 189, 248, 0.25); }

    /* PDF / File Attachment Dropzone */
    .pdf-upload-box {
      border: 1px dashed rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }

    .pdf-upload-box:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    .pdf-preview-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #4ade80;
      margin-top: 4px;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.35) 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 11px;
      color: #6ee7b7;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.38) 0%, rgba(5, 150, 105, 0.48) 100%);
      border-color: rgba(52, 211, 153, 0.7);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: scale(0.98); }

    /* Assignment Items */
    .assignment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .assignment-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      transition: all 0.2s ease;
    }

    .assignment-card:hover {
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }

    .sub-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .due-pill {
      font-size: 10.5px;
      color: #fbbf24;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .assignment-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .assignment-desc {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
      gap: 6px;
    }

    .action-group-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-link-action {
      color: #38bdf8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 7px;
      border-radius: 5px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn-view-subs {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-del:hover {
      background: #ef4444;
      color: #fff;
    }

    /* See More Button */
    .btn-see-more {
      width: 100%;
      padding: 9px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-see-more:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .no-data {
      text-align: center;
      padding: 20px 8px;
      color: #94a3b8;
      font-size: 12px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 14px;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 16px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .subs-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
    }

    .sub-item {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .btn-open-work {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      #streamGroup { grid-column: span 2; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-book-open-reader"></i>
        <span>Teacher Assignment</span>
      </div>
      <a href="teacher_dashboard.html" class="btn-dashboard">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
    </div>

    <!-- Create Assignment Form -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-plus-circle"></i> Create New Assignment
      </div>

      <!-- Class, Sec, Stream Selectors -->
      <div class="form-grid">
        <div class="input-group">
          <label>Class</label>
          <select id="asClass" class="form-select" onchange="handleClassChange()">
            <option value="Nursery">Nursery</option>
            <option value="LKG">LKG</option>
            <option value="UKG">UKG</option>
            <option value="1">Class 1st</option>
            <option value="2">Class 2nd</option>
            <option value="3">Class 3rd</option>
            <option value="4">Class 4th</option>
            <option value="5">Class 5th</option>
            <option value="6">Class 6th</option>
            <option value="7">Class 7th</option>
            <option value="8">Class 8th</option>
            <option value="9">Class 9th</option>
            <option value="10">Class 10th</option>
            <option value="11" selected>Class 11th</option>
            <option value="12">Class 12th</option>
          </select>
        </div>

        <div class="input-group">
          <label>Section</label>
          <select id="asSection" class="form-select">
            <option value="ALL">All Sec</option>
            <option value="A">Sec A</option>
            <option value="B" selected>Sec B</option>
            <option value="C">Sec C</option>
            <option value="D">Sec D</option>
          </select>
        </div>

        <div class="input-group" id="streamGroup">
          <label>Stream</label>
          <select id="asStream" class="form-select" onchange="populateSubjects()">
            <option value="PCM" selected>PCM</option>
            <option value="PCB">PCB</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <!-- Subject & Due Date -->
      <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 10px;">
        <div class="input-group">
          <label>Subject</label>
          <select id="asSubject" class="form-select" onchange="handleSubjectSelect()"></select>
          <input type="text" id="asCustomSubject" class="form-input" placeholder="Type Subject Name..." style="display:none; margin-top: 4px;">
        </div>

        <div class="input-group date-wrapper">
          <label>Due Date</label>
          <input type="date" id="asDueDate" class="form-input">
          <div class="date-pills">
            <button type="button" class="pill-btn" onclick="addDueDays(3)">+3 Days</button>
            <button type="button" class="pill-btn" onclick="addDueDays(7)">+1 Week</button>
            <button type="button" class="pill-btn" onclick="addDueDays(15)">+15 Days</button>
          </div>
        </div>
      </div>

      <!-- Assignment Title -->
      <div class="input-group" style="margin-bottom: 10px;">
        <label>Assignment Title</label>
        <input type="text" id="asTitle" class="form-input" placeholder="e.g. Chapter 4 Practice Sheet">
      </div>

      <!-- PDF / Document Direct Upload -->
      <div class="input-group" style="margin-bottom: 8px;">
        <label>Attach PDF / Image Document (Max 1MB)</label>
        <div class="pdf-upload-box" onclick="document.getElementById('asFileInput').click()">
          <i class="fa-solid fa-file-pdf" style="color: #38bdf8; font-size: 16px;"></i>
          <span style="font-size: 11.5px; color: #cbd5e1; margin-left: 6px;">Click to select File / PDF</span>
          <input type="file" id="asFileInput" accept=".pdf,image/*" style="display: none;" onchange="handleFileSelected(event)">
          <div id="filePreview" class="pdf-preview-tag" style="display: none;"></div>
        </div>
      </div>

      <!-- Google Drive / Cloud URL -->
      <div class="input-group" style="margin-bottom: 10px;">
        <label>Or Google Drive / Web Link (Optional)</label>
        <input type="url" id="asLink" class="form-input" placeholder="https://drive.google.com/...">
      </div>

      <!-- Description -->
      <div class="input-group" style="margin-bottom: 12px;">
        <label>Instructions & Description</label>
        <textarea id="asDesc" class="form-textarea" placeholder="Enter questions or guidelines for students..."></textarea>
      </div>

      <button id="postBtn" class="btn-submit" onclick="postAssignment()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Publish Assignment
      </button>
    </div>

    <!-- Active Assignments Card with +3 Pagination -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-list-check"></i> Published Assignments
      </div>

      <div id="assignmentList" class="assignment-list">
        <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading assignments...</div>
      </div>

      <button id="seeMoreBtn" class="btn-see-more" style="display: none;" onclick="showMoreAssignments()">
        <i class="fa-solid fa-angles-down"></i> See More (+3)
      </button>
    </div>

  </div>

  <!-- Submissions Modal -->
  <div class="modal-overlay" id="subsModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="subsModalTitle"><i class="fa-solid fa-users"></i> Submissions</span>
        <button class="modal-close" onclick="document.getElementById('subsModal').style.display='none'">&times;</button>
      </div>
      <div id="subsList" class="subs-list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const loggedInTeacher = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || "Teacher";

    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const subjectPresets = {
      primary: ["English", "Hindi", "Mathematics", "EVS", "Art & Craft", "General Knowledge", "Custom / Other..."],
      middle: ["English", "Hindi", "Mathematics", "Science", "Social Science", "Sanskrit", "Computer", "Custom / Other..."],
      secondary: ["English", "Hindi Course-A", "Mathematics", "Science", "Social Science", "Information Technology", "Custom / Other..."],
      pcm: ["Physics", "Chemistry", "Mathematics", "English Core", "Physical Education", "Computer Science", "Hindi", "Custom / Other..."],
      pcb: ["Physics", "Chemistry", "Biology", "English Core", "Physical Education", "Hindi", "Custom / Other..."],
      commerce: ["Accountancy", "Business Studies", "Economics", "English Core", "Mathematics", "Physical Education", "Hindi", "Custom / Other..."],
      arts: ["History", "Political Science", "Geography", "Economics", "English Core", "Hindi", "Sociology", "Custom / Other..."]
    };

    let uploadedFileDataUrl = '';
    let allPublishedAssignments = [];
    let visibleLimit = 3;

    window.onload = () => {
      addDueDays(3);
      handleClassChange();
      loadPublishedAssignments();
    };

    function addDueDays(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const localDate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      document.getElementById('asDueDate').value = localDate;
    }

    function handleClassChange() {
      const cls = document.getElementById('asClass').value;
      const isSenior = (cls === '11' || cls === '12');
      document.getElementById('streamGroup').style.display = isSenior ? 'flex' : 'none';
      populateSubjects();
    }

  function populateSubjects() {
      const cls = document.getElementById('asClass').value;
      const stream = document.getElementById('asStream').value;
      const subSelect = document.getElementById('asSubject');
      subSelect.innerHTML = '';

      let list = [];
      if (['Nursery','LKG','UKG','1','2','3','4','5'].includes(cls)) {
        list = subjectPresets.primary;
      } else if (['6','7','8'].includes(cls)) {
        list = subjectPresets.middle;
      } else if (['9','10'].includes(cls)) {
        list = subjectPresets.secondary;
      } else if (cls === '11' || cls === '12') {
        if (stream === 'PCM') list = subjectPresets.pcm;
        else if (stream === 'PCB') list = subjectPresets.pcb;
        else if (stream === 'Commerce') list = subjectPresets.commerce;
        else list = subjectPresets.arts;
      }

      list.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = sub;
        subSelect.appendChild(opt);
      });

      handleSubjectSelect();
    }

    function handleSubjectSelect() {
      const sub = document.getElementById('asSubject').value;
      const customBox = document.getElementById('asCustomSubject');
      customBox.style.display = (sub === 'Custom / Other...') ? 'block' : 'none';
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 1024 * 1024) {
        alert("⚠️ फ़ाइल 1MB से बड़ी है! कृपया Google Drive लिंक का उपयोग करें।");
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedFileDataUrl = e.target.result;
        const prev = document.getElementById('filePreview');
        prev.style.display = 'inline-flex';
        prev.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${file.name}`;
      };
      reader.readAsDataURL(file);
    }

    async function postAssignment() {
      const classNum = document.getElementById('asClass').value;
      const section = document.getElementById('asSection').value;
      const stream = (classNum === '11' || classNum === '12') ? document.getElementById('asStream').value : 'General';
      
      let subject = document.getElementById('asSubject').value;
      if (subject === 'Custom / Other...') {
        subject = document.getElementById('asCustomSubject').value.trim() || 'General';
      }

      const dueDate = document.getElementById('asDueDate').value;
      const title = document.getElementById('asTitle').value.trim();
      const directLink = document.getElementById('asLink').value.trim();
      const description = document.getElementById('asDesc').value.trim();

      if (!title || !dueDate) {
        return alert("कृपया Title और Due Date अवश्य भरें!");
      }

      const finalResource = uploadedFileDataUrl || directLink || '';

      const btn = document.getElementById('postBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing...';

      try {
        await db.collection('assignments').add({
          classNum,
          section,
          stream,
          subject,
          dueDate,
          title,
          link: finalResource,
          description,
          teacherName: loggedInTeacher,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("✅ असाइनमेंट सफलतापूर्वक पब्लिश हो गया!");
        document.getElementById('asTitle').value = '';
        document.getElementById('asLink').value = '';
        document.getElementById('asDesc').value = '';
        document.getElementById('asFileInput').value = '';
        document.getElementById('filePreview').style.display = 'none';
        uploadedFileDataUrl = '';
      } catch(e) {
        console.error("Assignment create error:", e);
        alert("असाइनमेंट पब्लिश करने में त्रुटि हुई!");
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publish Assignment';
    }

    function loadPublishedAssignments() {
      db.collection('assignments').orderBy('createdAt', 'desc').onSnapshot(snap => {
        allPublishedAssignments = [];
        snap.forEach(doc => {
          allPublishedAssignments.push({ id: doc.id, ...doc.data() });
        });
        renderAssignments();
      });
    }

    function renderAssignments() {
      const list = document.getElementById('assignmentList');
      const seeMoreBtn = document.getElementById('seeMoreBtn');

      if (allPublishedAssignments.length === 0) {
        list.innerHTML = '<div class="no-data">अभी तक कोई असाइनमेंट पब्लिश नहीं किया गया है।</div>';
        seeMoreBtn.style.display = 'none';
        return;
      }

      const visibleBatch = allPublishedAssignments.slice(0, visibleLimit);
      list.innerHTML = '';

      visibleBatch.forEach(d => {
        const card = document.createElement('div');
        card.className = 'assignment-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="sub-badge">${d.subject || 'General'} • Class ${d.classNum} (${d.section === 'ALL' ? 'All Sec' : 'Sec ' + d.section})</span>
            <span class="due-pill"><i class="fa-solid fa-hourglass-half"></i> Due: ${d.dueDate}</span>
          </div>
          <div class="assignment-title">${d.title}</div>
          <div class="assignment-desc">${d.description || 'No instructions provided.'}</div>
          <div class="card-actions">
            <div class="action-group-left">
              ${d.link ? `<a href="${d.link}" target="_blank" download="Assignment_File" class="btn-link-action"><i class="fa-solid fa-paperclip"></i> Open File</a>` : ''}
              <button class="btn-view-subs" onclick="viewSubmissions('${d.id}', '${(d.title || '').replace(/'/g, "\\'")}')">
                <i class="fa-solid fa-clipboard-check"></i> Submissions
              </button>
            </div>
            <button class="btn-del" onclick="deleteAssignment('${d.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        `;
        list.appendChild(card);
      });

      if (allPublishedAssignments.length > visibleLimit) {
        seeMoreBtn.style.display = 'flex';
        seeMoreBtn.innerHTML = `<i class="fa-solid fa-angles-down"></i> See More (+3) • Remaining: ${allPublishedAssignments.length - visibleLimit}`;
      } else {
        seeMoreBtn.style.display = 'none';
      }
    }

    function showMoreAssignments() {
      visibleLimit += 3;
      renderAssignments();
    }

    async function viewSubmissions(asId, title) {
      const modal = document.getElementById('subsModal');
      const titleSpan = document.getElementById('subsModalTitle');
      const list = document.getElementById('subsList');

      titleSpan.innerHTML = `<i class="fa-solid fa-clipboard-check"></i> Submissions: ${title}`;
      list.innerHTML = '<div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> लोड हो रहा है...</div>';
      modal.style.display = 'flex';

      try {
        const snap = await db.collection('assignment_submissions').where('assignmentId', '==', asId).get();
        if (snap.empty) {
          list.innerHTML = '<div class="no-data">किसी छात्र ने अभी तक सबमिट नहीं किया है।</div>';
          return;
        }

        let html = '';
        snap.forEach(doc => {
          const s = doc.data();
          html += `
            <div class="sub-item">
              <div>
                <div style="font-size: 12px; font-weight: 600; color: #ffffff;">${s.userName || 'Student'}</div>
                <div style="font-size: 10.5px; color: #94a3b8;">${s.userEmail || ''}</div>
              </div>
              <a href="${s.solutionLink}" target="_blank" class="btn-open-work">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Work
              </a>
            </div>
          `;
        });
        list.innerHTML = html;
      } catch(e) {
        list.innerHTML = '<div class="no-data">सबमिशन लोड करने में त्रुटि हुई!</div>';
      }
    }

    async function deleteAssignment(docId) {
      if (!confirm("क्या आप वाकई इस असाइनमेंट को हटाना चाहते हैं?")) return;
      try {
        await db.collection('assignments').doc(docId).delete();
        alert("✅ असाइनमेंट हटा दिया गया!");
      } catch (e) {
        alert("डिलीट करने में त्रुटि हुई!");
      }
    }
  </script>
</body>
</html>
