<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance Portal - SSKL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { 
      background-color: #070d19;
      min-height: 100vh; 
      color: #ffffff; 
      overflow-x: hidden;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #070d19 0%, #0f172a 50%, #1e293b 100%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 760px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Bar Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.75);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.2;
    }

    .brand i { font-size: 18px; flex-shrink: 0; }

    .btn-dashboard {
      text-decoration: none;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s ease;
    }

    .btn-dashboard:hover {
      background: rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }

    /* Cards */
    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 11.5px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 12.5px;
      outline: none;
      transition: 0.2s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }

    .btn-fetch {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s ease;
      margin-top: 4px;
    }

    .btn-fetch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }

    /* Lock Alert Banner */
    .lock-notice {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11.5px;
      color: #38bdf8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }

    /* Sheet Header Info */
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12.5px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Stats Overview Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }

    .stat-val { font-size: 16px; font-weight: 700; }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 600; margin-top: 2px; }

    .val-total { color: #38bdf8; }
    .val-present { color: #4ade80; }
    .val-absent { color: #f87171; }
    .val-percent { color: #fbbf24; }

    /* Quick Action Controls */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .btn-quick {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-all-p { background: rgba(74, 222, 128, 0.15); color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
    .btn-all-p:hover { background: rgba(74, 222, 128, 0.25); }

    .btn-all-a { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .btn-all-a:hover { background: rgba(239, 68, 68, 0.25); }

    .btn-copy-mail { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
    .btn-copy-mail:hover { background: rgba(56, 189, 248, 0.25); }

    /* Student List */
    .attendance-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .attendance-list::-webkit-scrollbar { width: 5px; }
    .attendance-list::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      gap: 8px;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }

    .student-info:hover .student-name { color: #38bdf8; }

    .roll-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      flex-shrink: 0;
      min-width: 30px;
      text-align: center;
    }

    .sec-badge {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .student-name {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: 0.2s;
    }

    .btn-info-icon {
      color: #64748b;
      font-size: 12px;
      margin-left: 2px;
    }

    /* Action Controls & Locking */
    .toggle-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
    }

    .toggle-btn {
      width: 32px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.6);
      color: #94a3b8;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn.active-p { background: #22c55e; color: #ffffff; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
    .toggle-btn.active-a { background: #ef4444; color: #ffffff; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
    .toggle-btn.active-l { background: #eab308; color: #ffffff; border-color: #eab308; box-shadow: 0 0 10px rgba(234, 179, 8, 0.3); }

    .locked-badge {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-save {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s ease;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.35);
    }

    .no-data {
      text-align: center;
      padding: 24px 10px;
      color: #94a3b8;
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 14px;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }

    .detail-label { color: #94a3b8; }
    .detail-value { color: #fff; font-weight: 600; text-align: right; }

    .copy-tag {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      margin-left: 5px;
    }

    @media (max-width: 480px) {
      .top-bar { padding: 12px 14px; }
      .brand { font-size: 13.5px; }
      .btn-dashboard { padding: 6px 10px; font-size: 11px; }
      .card { padding: 16px; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-clipboard-user"></i>
        <span>Teacher Attendance Management</span>
      </div>
      <a href="teacher_dashboard.html" class="btn-dashboard">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
    </div>

    <!-- Filter Card -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-calendar-days"></i> Select Date & Class Criteria
      </div>

      <div class="filter-grid">
        <div class="input-group">
          <label>Attendance Date (Calendar)</label>
          <input type="date" id="attDate" class="form-input">
        </div>

        <div class="input-group">
          <label>Class</label>
          <select id="attClass" class="form-select" onchange="toggleStream()">
            <option value="9">Class 9th</option>
            <option value="10">Class 10th</option>
            <option value="11" selected>Class 11th</option>
            <option value="12">Class 12th</option>
          </select>
        </div>

        <div class="input-group">
          <label>Section</label>
          <select id="attSection" class="form-select">
            <option value="ALL">All Sections</option>
            <option value="A" selected>Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
            <option value="D">Section D</option>
          </select>
        </div>

        <div class="input-group" id="streamBox">
          <label>Stream</label>
          <select id="attStream" class="form-select">
            <option value="PCM" selected>PCM</option>
            <option value="PCB">PCB</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <button class="btn-fetch" onclick="loadList()">
        <i class="fa-solid fa-users-viewfinder"></i> Load Student Sheet
      </button>
    </div>

    <!-- Attendance Sheet Container -->
    <div id="sheetCard" class="card" style="display: none;">
      <div class="sheet-meta">
        <span id="sheetTitle"><i class="fa-solid fa-layer-group"></i> Class Sheet</span>
        <span id="sheetDate" style="color: #94a3b8; font-size: 11.5px;"></span>
      </div>

      <!-- Lock Notice -->
      <div class="lock-notice" id="lockNotice" style="display: none;">
        <i class="fa-solid fa-lock"></i>
        <span>पहले से <b>Present (P)</b> छात्रों का रिकॉर्ड लॉक है। केवल <b>Absent / Leave</b> को बदला जा सकता है।</span>
      </div>

      <!-- Live Counters -->
      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-val val-total" id="stTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-present" id="stP">0</div>
          <div class="stat-label">Present</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-absent" id="stA">0</div>
          <div class="stat-label">Absent</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-percent" id="stPct">0%</div>
          <div class="stat-label">Rate</div>
        </div>
      </div>

      <!-- Quick Action Controls -->
      <div class="quick-actions">
        <button class="btn-quick btn-all-p" onclick="markAllUnlocked('P')"><i class="fa-solid fa-check"></i> Mark Remaining Present</button>
        <button class="btn-quick btn-all-a" onclick="markAllUnlocked('A')"><i class="fa-solid fa-xmark"></i> Mark Remaining Absent</button>
        <button class="btn-quick btn-copy-mail" onclick="copyAllEmails()"><i class="fa-solid fa-envelope"></i> Copy All Emails</button>
      </div>

      <!-- Student List -->
      <div id="studentList" class="attendance-list"></div>

      <!-- Save Button -->
      <button id="saveBtn" class="btn-save" onclick="saveRecord()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Save & Submit Attendance
      </button>
    </div>

  </div>

  <!-- Student Info Popup Modal -->
  <div class="modal-overlay" id="studentModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span><i class="fa-solid fa-id-card"></i> Student Details</span>
        <button class="modal-close" onclick="document.getElementById('studentModal').style.display='none'">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const loggedInTeacher = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || "Teacher";

    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = [];

    // Set today's local date automatically on page load
    window.onload = () => {
      const today = new Date();
      const localDate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      document.getElementById('attDate').value = localDate;
      toggleStream();
    };

    function toggleStream() {
      const clsNum = document.getElementById('attClass').value;
      document.getElementById('streamBox').style.display = (clsNum === '11' || clsNum === '12') ? 'flex' : 'none';
    }

    // Number extraction for class matching (e.g., "11th - A", "Class 11th", "11th Class")
    function extractNum(val) {
      if (!val) return '';
      const m = val.toString().match(/\d+/);
      return m ? m[0] : '';
    }

    // Section extraction (e.g. from section field or "11th - A")
    function extractSec(d) {
      if (d.section) return d.section.toString().trim().toUpperCase();
      if (d.sec) return d.sec.toString().trim().toUpperCase();
      const raw = (d.class || d.className || d.classSection || '').toString();
      const match = raw.match(/[-\s]+([A-D])/i);
      return match ? match[1].toUpperCase() : 'A';
    }

    // Robust stream matcher: handles "Science(PCM)", "PCM", "Science (PCM)", "Science"
    function matchStream(d, targetStream) {
      if (targetStream === 'ALL' || targetStream === 'GENERAL') return true;
      const raw = (d.stream || d.curriculum || d.subject || d.streamSubject || '').toString().toUpperCase();
      if (!raw) return true;
      if (raw.includes(targetStream)) return true;
      if (targetStream === 'PCM' && (raw.includes('PCM') || raw === 'SCIENCE')) return true;
      if (targetStream === 'PCB' && (raw.includes('PCB') || raw === 'SCIENCE')) return true;
      if (targetStream === 'COMMERCE' && raw.includes('COMMERCE')) return true;
      if (targetStream === 'ARTS' && raw.includes('ARTS')) return true;
      return false;
    }

    async function loadList() {
      const date = document.getElementById('attDate').value;
      const cNum = document.getElementById('attClass').value;
      const sec = document.getElementById('attSection').value.trim().toUpperCase();
      const stream = (cNum === '11' || cNum === '12') ? document.getElementById('attStream').value.trim().toUpperCase() : 'GENERAL';

      if (!date) return alert("कृपया तारीख चुनें!");

      document.getElementById('sheetCard').style.display = 'block';
      document.getElementById('sheetTitle').innerHTML = `<i class="fa-solid fa-layer-group"></i> Class ${cNum}th ${sec !== 'ALL' ? '- Sec ' + sec : '(All Sec)'} ${cNum >= 11 ? '(' + stream + ')' : ''}`;
      document.getElementById('sheetDate').innerText = `Date: ${date}`;

      const container = document.getElementById('studentList');
      container.innerHTML = '<div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> डेटा लोड हो रहा है...</div>';

      // 1. Fetch Existing Attendance Record
      const docId = `Class${cNum}_${sec}_${stream}_${date}`;
      let oldData = {};
      let hasOld = false;

      try {
        const snap = await db.collection('attendance').doc(docId).get();
        if (snap.exists && snap.data().students) {
          oldData = snap.data().students;
          hasOld = true;
        }
      } catch(e) {
        console.warn("No previous record:", e);
      }

      document.getElementById('lockNotice').style.display = hasOld ? 'flex' : 'none';

      // 2. Fetch Users Collection
      let rawUsers = [];
      try {
        const uSnap = await db.collection('users').get();
        if (!uSnap.empty) {
          uSnap.forEach(d => rawUsers.push({ id: d.id, ...d.data() }));
        }
        if (rawUsers.length === 0) {
          const sSnap = await db.collection('students').get();
          sSnap.forEach(d => rawUsers.push({ id: d.id, ...d.data() }));
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }

      students = [];

      rawUsers.forEach(d => {
        const role = (d.role || '').toString().toLowerCase();
        if (role === 'teacher' || role === 'admin') return;

        // Class Match
        const userClassStr = (d.class || d.className || d.grade || d.classSection || '').toString();
        if (extractNum(userClassStr) !== cNum) return;

        // Section Match
        const userSec = extractSec(d);
        if (sec !== 'ALL' && userSec !== sec) return;

        // Stream Match
        if (cNum === '11' || cNum === '12') {
          if (!matchStream(d, stream)) return;
        }

        // Student Data
        const roll = parseInt(d.rollNumber || d.roll || d.rollNo || 0);
        const name = d.username || d.fullName || d.name || d.displayName || `Student ${roll || ''}`;
        const prevStatus = oldData[d.id] || oldData[roll];

        // Present Locking Logic
        const finalStatus = prevStatus ? prevStatus : 'P';
        const isLocked = (prevStatus === 'P');

        students.push({
          id: d.id,
          name: name,
          email: d.email || 'N/A',
          phone: d.phone || d.mobile || d.phoneNumber || 'N/A',
          gender: d.gender || 'N/A',
          class: `Class ${cNum}th`,
          section: userSec,
          stream: d.stream || d.streamSubject || stream,
          roll: roll,
          status: finalStatus,
          locked: isLocked
        });
      });

      if (students.length === 0) {
        container.innerHTML = `<div class="no-data"><i class="fa-solid fa-circle-exclamation"></i> कोई छात्र नहीं मिला।<br><small style="color:#64748b;">(Class: ${cNum}th, Sec: ${sec}, Stream: ${stream})</small></div>`;
        calc();
        return;
      }

      // Sort by Section then Roll Number
      students.sort((a, b) => {
        if (a.section === b.section) return a.roll - b.roll;
        return a.section.localeCompare(b.section);
      });

      render();
    }

    function render() {
      const container = document.getElementById('studentList');
      container.innerHTML = '';

      students.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'student-item';

        let toggleHtml = '';
        if (s.locked) {
          toggleHtml = `
            <div class="locked-badge" title="Already marked Present (Locked)">
              <i class="fa-solid fa-lock"></i> Present
            </div>
          `;
        } else {
          toggleHtml = `
            <div class="toggle-group">
              <button class="toggle-btn ${s.status === 'P' ? 'active-p' : ''}" onclick="setSt(${idx},'P')">P</button>
              <button class="toggle-btn ${s.status === 'A' ? 'active-a' : ''}" onclick="setSt(${idx},'A')">A</button>
              <button class="toggle-btn ${s.status === 'L' ? 'active-l' : ''}" onclick="setSt(${idx},'L')">L</button>
            </div>
          `;
        }

        div.innerHTML = `
          <div class="student-info" onclick="showInfo(${idx})" title="Click to view details & email">
            <span class="roll-badge">${s.roll < 10 ? '0' + s.roll : s.roll}</span>
            <span class="sec-badge">Sec ${s.section}</span>
            <span class="student-name">${s.name}</span>
            <i class="fa-solid fa-circle-info btn-info-icon"></i>
          </div>
          ${toggleHtml}
        `;
        container.appendChild(div);
      });

      calc();
    }

    function setSt(idx, st) {
      if (students[idx].locked) return;
      students[idx].status = st;
      render();
    }

    function markAllUnlocked(st) {
      students.forEach(s => {
        if (!s.locked) s.status = st;
      });
      render();
    }

    function calc() {
      const total = students.length;
      const p = students.filter(s => s.status === 'P').length;
      const a = students.filter(s => s.status === 'A').length;
      document.getElementById('stTotal').innerText = total;
      document.getElementById('stP').innerText = p;
      document.getElementById('stA').innerText = a;
      document.getElementById('stPct').innerText = total ? Math.round((p / total) * 100) + '%' : '0%';
    }

    function showInfo(idx) {
      const s = students[idx];
      document.getElementById('modalBody').innerHTML = `
        <div class="detail-row"><span>Full Name</span><b style="color:#38bdf8">${s.name}</b></div>
        <div class="detail-row"><span>Roll Number</span><b>${s.roll}</b></div>
        <div class="detail-row"><span>Class & Sec</span><b>${s.class} (Sec ${s.section})</b></div>
        <div class="detail-row"><span>Stream</span><b>${s.stream}</b></div>
        <div class="detail-row"><span>Status</span><b>${s.status === 'P' ? 'Present' : (s.status === 'A' ? 'Absent' : 'Leave')} ${s.locked ? '(🔒 Locked)' : ''}</b></div>
        <div class="detail-row" style="background: rgba(56, 189, 248, 0.08); padding: 8px; border-radius: 6px; margin-top: 6px;">
          <span><i class="fa-solid fa-envelope"></i> Email</span>
          <b>${s.email} ${s.email !== 'N/A' ? `<button class="copy-tag" onclick="copy('${s.email}')">Copy</button>` : ''}</b>
        </div>
        <div class="detail-row"><span><i class="fa-solid fa-phone"></i> Phone</span><b>${s.phone}</b></div>
      `;
      document.getElementById('studentModal').style.display = 'flex';
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      alert("✅ Copied: " + text);
    }

    function copyAllEmails() {
      const list = students.map(s => s.email).filter(e => e && e !== 'N/A');
      if (!list.length) return alert("कोई ईमेल नहीं मिला!");
      navigator.clipboard.writeText(list.join(', '));
      alert(`✅ ${list.length} छात्रों के ईमेल कॉपी हो गए!`);
    }

    async function saveRecord() {
      const date = document.getElementById('attDate').value;
      const cNum = document.getElementById('attClass').value;
      const sec = document.getElementById('attSection').value;
      const stream = (cNum === '11' || cNum === '12') ? document.getElementById('attStream').value : 'General';

      if (!students.length) return alert("छात्र लिस्ट खाली है!");

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; 
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

      const map = {};
      students.forEach(s => map[s.id || s.roll] = s.status);
      const p = students.filter(s => s.status === 'P').length;
      const a = students.filter(s => s.status === 'A').length;
      const l = students.filter(s => s.status === 'L').length;

      const docId = `Class${cNum}_${sec}_${stream}_${date}`;

      try {
        await db.collection('attendance').doc(docId).set({
          date, 
          class: `Class ${cNum}th`, 
          section: sec, 
          stream,
          teacher: loggedInTeacher,
          total: students.length, 
          present: p,
          absent: a,
          leave: l,
          percentage: students.length ? Math.round((p / students.length) * 100) : 0,
          students: map,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("✅ अटेंडेंस सफलतापूर्वक सेव हो गई!");
        loadList();
      } catch(e) {
        console.error("Save error:", e);
        alert("अटेंडेंस सेव करने में त्रुटि हुई!");
      }
      btn.disabled = false; 
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save & Submit Attendance';
    }
  </script>
</body>
</html>
