<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance - SSKL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #070d19; color: #fff; padding: 12px; min-height: 100vh; }
    .container { max-width: 680px; margin: 0 auto; }

    /* Compact Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 10px 14px; border-radius: 10px;
      border: 1px solid #38bdf840; margin-bottom: 12px;
    }
    .header h2 { font-size: 14px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .btn-dash {
      color: #38bdf8; background: #38bdf81a; border: 1px solid #38bdf840;
      padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 600;
    }

    /* Minimal Box */
    .box {
      background: #0f172a; border: 1px solid #334155; border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }

    /* Form Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
    label { font-size: 10.5px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 3px; }
    .inp {
      width: 100%; padding: 7px 9px; background: #1e293b; border: 1px solid #475569;
      border-radius: 6px; color: #fff; font-size: 12px; outline: none;
    }
    .inp:focus { border-color: #38bdf8; }

    /* Action Buttons */
    .btn-blue {
      width: 100%; padding: 9px; background: #0284c7; border: none;
      border-radius: 8px; color: #fff; font-weight: 600; font-size: 12.5px; cursor: pointer;
    }
    .btn-green {
      width: 100%; padding: 10px; background: #16a34a; border: none;
      border-radius: 8px; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px;
    }

    /* Stats Bar */
    .stats { display: flex; gap: 6px; margin-bottom: 10px; }
    .stat { flex: 1; background: #1e293b; padding: 6px; border-radius: 6px; text-align: center; font-size: 10px; color: #94a3b8; }
    .stat b { display: block; font-size: 14px; }

    /* Quick Action Controls */
    .quick-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .q-btn {
      padding: 5px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600; cursor: pointer;
    }

    /* Student List */
    .list { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow-y: auto; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155;
    }
    .item-info {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600;
      min-width: 0; cursor: pointer;
    }
    .roll {
      background: #38bdf820; color: #38bdf8; padding: 2px 6px; border-radius: 4px;
      font-size: 11px; min-width: 26px; text-align: center; flex-shrink: 0;
    }
    .s-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Toggles */
    .toggles { display: flex; gap: 4px; flex-shrink: 0; }
    .t-btn {
      width: 30px; height: 28px; border-radius: 5px; border: 1px solid #475569;
      background: #0f172a; color: #94a3b8; font-weight: 700; font-size: 11px; cursor: pointer;
    }
    .t-btn.p { background: #22c55e; color: #fff; border-color: #22c55e; }
    .t-btn.a { background: #ef4444; color: #fff; border-color: #ef4444; }
    .t-btn.l { background: #eab308; color: #fff; border-color: #eab308; }

    .no-data { text-align: center; padding: 18px; color: #94a3b8; font-size: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
      z-index: 100; padding: 14px;
    }
    .modal-content {
      background: #0f172a; border: 1px solid #38bdf850; border-radius: 12px;
      width: 100%; max-width: 360px; padding: 16px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #38bdf8; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #1e293b; }
    .row span:first-child { color: #94a3b8; }
    .copy-tag { background: #38bdf820; color: #38bdf8; border: none; padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-left: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-clipboard-user"></i> Attendance</h2>
      <a href="teacher_dashboard.html" class="btn-dash"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <!-- Filter Card -->
    <div class="box">
      <div class="grid">
        <div>
          <label>Date</label>
          <input type="date" id="attDate" class="inp">
        </div>
        <div>
          <label>Class</label>
          <select id="attClass" class="inp" onchange="toggleStream()">
            <option value="9">Class 9th</option>
            <option value="10">Class 10th</option>
            <option value="11">Class 11th</option>
            <option value="12">Class 12th</option>
          </select>
        </div>
        <div>
          <label>Section</label>
          <select id="attSection" class="inp">
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
          </select>
        </div>
        <div id="streamBox" style="display: none;">
          <label>Stream</label>
          <select id="attStream" class="inp">
            <option value="PCM">PCM</option>
            <option value="PCB">PCB</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>
      <button class="btn-blue" onclick="loadList()"><i class="fa-solid fa-arrow-down"></i> Load Sheet</button>
    </div>

    <!-- Sheet Card -->
    <div id="sheetCard" class="box" style="display: none;">
      <div class="stats">
        <div class="stat"><b id="stTotal" style="color:#38bdf8">0</b>Total</div>
        <div class="stat"><b id="stP" style="color:#4ade80">0</b>Present</div>
        <div class="stat"><b id="stA" style="color:#f87171">0</b>Absent</div>
        <div class="stat"><b id="stPct" style="color:#fbbf24">0%</b>Rate</div>
      </div>

      <div class="quick-bar">
        <button class="q-btn" style="background:#22c55e25; color:#4ade80;" onclick="markAll('P')">All Present</button>
        <button class="q-btn" style="background:#ef444425; color:#f87171;" onclick="markAll('A')">All Absent</button>
        <button class="q-btn" style="background:#38bdf825; color:#38bdf8;" onclick="copyAllEmails()">Copy Emails</button>
      </div>

      <div id="studentList" class="list"></div>

      <button id="saveBtn" class="btn-green" onclick="saveRecord()"><i class="fa-solid fa-floppy-disk"></i> Save Attendance</button>
    </div>
  </div>

  <!-- Info Modal -->
  <div class="modal-overlay" id="studentModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-head">
        <span>Student Details</span>
        <span style="cursor:pointer;" onclick="document.getElementById('studentModal').style.display='none'">&times;</span>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const loggedInTeacher = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || "Teacher";

    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = [];

    window.onload = () => {
      document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
      toggleStream();
    };

    function toggleStream() {
      const clsNum = document.getElementById('attClass').value;
      document.getElementById('streamBox').style.display = (clsNum === '11' || clsNum === '12') ? 'block' : 'none';
    }

    function extractNum(val) {
      if (!val) return '';
      const m = val.toString().match(/\d+/);
      return m ? m[0] : '';
    }

    async function loadList() {
      const date = document.getElementById('attDate').value;
      const cNum = document.getElementById('attClass').value;
      const sec = document.getElementById('attSection').value.trim().toUpperCase();
      const stream = (cNum === '11' || cNum === '12') ? document.getElementById('attStream').value.trim().toUpperCase() : 'GENERAL';

      if (!date) return alert("तारीख चुनें!");

      document.getElementById('sheetCard').style.display = 'block';
      const container = document.getElementById('studentList');
      container.innerHTML = '<div class="no-data">Loading...</div>';

      const docId = `Class${cNum}_${sec}_${stream}_${date}`;
      let oldData = {};
      try {
        const snap = await db.collection('attendance').doc(docId).get();
        if (snap.exists) oldData = snap.data().students || {};
      } catch(e) {}

      db.collection('users').get().then(snapshot => {
        students = [];
        snapshot.forEach(doc => {
          const d = doc.data();
          if ((d.role || '').toLowerCase() === 'teacher' || (d.role || '').toLowerCase() === 'admin') return;

          if (extractNum(d.class || d.className || '') !== cNum) return;
          if ((d.section || 'A').toString().trim().toUpperCase() !== sec) return;

          if (cNum === '11' || cNum === '12') {
            const uStr = (d.stream || d.curriculum || '').toString().trim().toUpperCase();
            if (uStr && uStr !== stream && !(uStr === 'SCIENCE' && (stream === 'PCM' || stream === 'PCB'))) return;
          }

          const roll = parseInt(d.rollNumber || d.roll || 0);
          students.push({
            id: doc.id,
            name: d.fullName || d.name || `Student ${roll}`,
            email: d.email || 'N/A',
            phone: d.phone || d.mobile || 'N/A',
            gender: d.gender || 'N/A',
            class: `Class ${cNum}th`,
            section: sec,
            stream: d.stream || stream,
            roll: roll,
            status: oldData[doc.id] || oldData[roll] || 'P'
          });
        });

        if (!students.length) {
          container.innerHTML = '<div class="no-data">कोई छात्र नहीं मिला।</div>';
          calc();
          return;
        }

        students.sort((a,b) => a.roll - b.roll);
        render();
      }).catch(err => {
        container.innerHTML = '<div class="no-data">डेटाबेस एरर!</div>';
      });
    }

    function render() {
      const container = document.getElementById('studentList');
      container.innerHTML = '';
      students.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-info" onclick="showInfo(${idx})">
            <span class="roll">${s.roll < 10 ? '0'+s.roll : s.roll}</span>
            <span class="s-name">${s.name}</span>
            <i class="fa-solid fa-circle-info" style="color:#64748b; font-size:11px;"></i>
          </div>
          <div class="toggles">
            <button class="t-btn ${s.status === 'P' ? 'p' : ''}" onclick="setSt(${idx},'P')">P</button>
            <button class="t-btn ${s.status === 'A' ? 'a' : ''}" onclick="setSt(${idx},'A')">A</button>
            <button class="t-btn ${s.status === 'L' ? 'l' : ''}" onclick="setSt(${idx},'L')">L</button>
          </div>
        `;
        container.appendChild(div);
      });
      calc();
    }

    function setSt(idx, st) { students[idx].status = st; render(); }
    function markAll(st) { students.forEach(s => s.status = st); render(); }

    function calc() {
      const total = students.length;
      const p = students.filter(s => s.status === 'P').length;
      const a = students.filter(s => s.status === 'A').length;
      document.getElementById('stTotal').innerText = total;
      document.getElementById('stP').innerText = p;
      document.getElementById('stA').innerText = a;
      document.getElementById('stPct').innerText = total ? Math.round((p/total)*100)+'%' : '0%';
    }

    function showInfo(idx) {
      const s = students[idx];
      document.getElementById('modalBody').innerHTML = `
        <div class="row"><span>Name</span><b style="color:#38bdf8">${s.name}</b></div>
        <div class="row"><span>Roll / Sec</span><b>${s.roll} (${s.section})</b></div>
        <div class="row"><span>Class / Stream</span><b>${s.class} (${s.stream})</b></div>
        <div class="row"><span>Email</span><b>${s.email} ${s.email !== 'N/A' ? `<button class="copy-tag" onclick="copy('${s.email}')">Copy</button>` : ''}</b></div>
        <div class="row"><span>Phone</span><b>${s.phone}</b></div>
      `;
      document.getElementById('studentModal').style.display = 'flex';
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      alert("Copied: " + text);
    }

    function copyAllEmails() {
      const list = students.map(s => s.email).filter(e => e && e !== 'N/A');
      if (!list.length) return alert("कोई ईमेल नहीं मिला!");
      navigator.clipboard.writeText(list.join(', '));
      alert(`${list.length} ईमेल कॉपी हो गए!`);
    }

    async function saveRecord() {
      const date = document.getElementById('attDate').value;
      const cNum = document.getElementById('attClass').value;
      const sec = document.getElementById('attSection').value;
      const stream = (cNum === '11' || cNum === '12') ? document.getElementById('attStream').value : 'General';

      if (!students.length) return alert("छात्र नहीं हैं!");

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';

      const map = {};
      students.forEach(s => map[s.id || s.roll] = s.status);
      const p = students.filter(s => s.status === 'P').length;
      const docId = `Class${cNum}_${sec}_${stream}_${date}`;

      try {
        await db.collection('attendance').doc(docId).set({
          date, class: `Class ${cNum}th`, section: sec, stream,
          teacher: loggedInTeacher,
          total: students.length, present: p,
          students: map,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        alert("✅ अटेंडेंस सेव हो गई!");
      } catch(e) {
        alert("त्रुटि हुई!");
      }
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Attendance';
    }
  </script>
</body>
</html>
