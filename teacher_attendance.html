<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teacher Attendance Portal - SSKL</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: #070d19;
      min-height: 100vh; 
      color: #ffffff; 
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 75%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 740px;
      animation: softFadeIn 0.25s ease-out;
    }

    @keyframes softFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.75);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.2;
    }

    .brand i {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 7px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      flex-shrink: 0;
    }

    .btn-dashboard {
      text-decoration: none;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 7px 12px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-dashboard:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* Cards */
    .card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Date Row Responsive Grid */
    .date-search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 9px 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: #38bdf8;
    }

    .date-quick-btn {
      padding: 9px 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .date-quick-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 10.5px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .btn-fetch {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: none;
      border-radius: 11px;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* Lock Alert Banner */
    .lock-notice {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #38bdf8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }

    /* Sheet Header */
    .sheet-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat-val { font-size: 15px; font-weight: 700; }
    .stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 600; margin-top: 2px; }

    .val-total { color: #38bdf8; }
    .val-present { color: #4ade80; }
    .val-absent { color: #f87171; }
    .val-neutral { color: #94a3b8; }

    /* Quick Action Controls */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn-quick {
      padding: 7px 6px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn-all-p { background: rgba(74, 222, 128, 0.15); color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
    .btn-all-a { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .btn-all-clear { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.3); }
    .btn-copy-mail { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }

    /* Student List */
    .attendance-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
      max-height: 380px;
      overflow-y: auto;
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      border-radius: 11px;
      gap: 6px;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .roll-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      min-width: 26px;
      text-align: center;
    }

    .sec-badge {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 5px;
      border-radius: 5px;
      font-size: 9.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .student-name {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-info-icon {
      color: #64748b;
      font-size: 11px;
      margin-left: 2px;
    }

    /* Toggles */
    .toggle-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .toggle-btn {
      width: 29px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.6);
      color: #94a3b8;
      font-weight: 700;
      font-size: 10.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn.active-p { background: #22c55e; color: #ffffff; border-color: #22c55e; }
    .toggle-btn.active-a { background: #ef4444; color: #ffffff; border-color: #ef4444; }
    .toggle-btn.active-l { background: #eab308; color: #ffffff; border-color: #eab308; }

    .locked-badge {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Elegant Soft Save Button */
    .btn-save-smooth {
      width: 100%;
      padding: 11px 14px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.35) 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 11px;
      color: #6ee7b7;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .btn-save-smooth:active { transform: scale(0.98); }

    .no-data {
      text-align: center;
      padding: 20px 8px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.4;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 14px;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 11.5px;
    }

    .detail-label { color: #94a3b8; }
    .detail-value { color: #fff; font-weight: 600; text-align: right; }

    .copy-tag {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      cursor: pointer;
      margin-left: 4px;
    }

    @media (max-width: 480px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
      #streamBox {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-clipboard-user"></i>
        <span>Teacher Attendance</span>
      </div>
      <a href="teacher_dashboard.html" class="btn-dashboard">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
    </div>

    <!-- Filter Card -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-calendar-days"></i> Select Date & Criteria
      </div>

      <!-- Compact 3-Column Date Row -->
      <div class="date-search-row">
        <input type="date" id="attDate" class="form-input">
        <button class="date-quick-btn" onclick="setQuickDate(0)"><i class="fa-solid fa-bolt"></i> Today</button>
        <button class="date-quick-btn" onclick="setQuickDate(-1)"><i class="fa-solid fa-clock-rotate-left"></i> Y'day</button>
      </div>

      <div class="filter-grid">
        <div class="input-group">
          <label>Class</label>
          <select id="attClass" class="form-select" onchange="toggleStream()">
            <option value="9">Class 9th</option>
            <option value="10">Class 10th</option>
            <option value="11" selected>Class 11th</option>
            <option value="12">Class 12th</option>
          </select>
        </div>

        <div class="input-group">
          <label>Section</label>
          <select id="attSection" class="form-select">
            <option value="ALL">All Sec</option>
            <option value="A">Sec A</option>
            <option value="B" selected>Sec B</option>
            <option value="C">Sec C</option>
            <option value="D">Sec D</option>
          </select>
        </div>

        <div class="input-group" id="streamBox">
          <label>Stream</label>
          <select id="attStream" class="form-select">
            <option value="PCM" selected>PCM</option>
            <option value="PCB">PCB</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <button class="btn-fetch" onclick="loadList()">
        <i class="fa-solid fa-users-viewfinder"></i> Load Student Sheet
      </button>
    </div>
<!-- Attendance Sheet Container -->
    <div id="sheetCard" class="card" style="display: none;">
      <div class="sheet-meta">
        <span id="sheetTitle"><i class="fa-solid fa-layer-group"></i> Class Sheet</span>
        <span id="sheetDate" style="color: #94a3b8; font-size: 11px;"></span>
      </div>

      <!-- Lock Notice -->
      <div class="lock-notice" id="lockNotice" style="display: none;">
        <i class="fa-solid fa-lock"></i>
        <span>पहले से <b>Present (P)</b> छात्रों का रिकॉर्ड सुरक्षित (Locked) है।</span>
      </div>

      <!-- 4 Stats Boxes -->
      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-val val-total" id="stTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-present" id="stP">0</div>
          <div class="stat-label">Present</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-absent" id="stA">0</div>
          <div class="stat-label">Absent</div>
        </div>
        <div class="stat-box">
          <div class="stat-val val-neutral" id="stUnset">0</div>
          <div class="stat-label">General</div>
        </div>
      </div>

      <!-- Quick Actions (Pure Dark Theme Styled) -->
      <div class="quick-actions" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;">
        <button type="button" class="btn-quick" style="background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); padding: 9px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="markRemaining('P')">
          <i class="fa-solid fa-check"></i> Mark Remaining Present
        </button>
        <button type="button" class="btn-quick" style="background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); padding: 9px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="markRemaining('A')">
          <i class="fa-solid fa-xmark"></i> Mark Remaining Absent
        </button>
        <button type="button" class="btn-quick" style="background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); padding: 9px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="resetToGeneral()">
          <i class="fa-solid fa-rotate-left"></i> Reset to General
        </button>
        <button type="button" class="btn-quick" style="background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); padding: 9px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="copyAllEmails()">
          <i class="fa-solid fa-envelope"></i> Copy Emails
        </button>
      </div>

      <!-- Student List -->
      <div id="studentList" class="attendance-list"></div>

      <!-- Save Button -->
      <button id="saveBtn" class="btn-save-smooth" onclick="saveRecord()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Save & Submit Attendance
      </button>
    </div>

  </div>

  <!-- Student Info Modal -->
  <div class="modal-overlay" id="studentModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span><i class="fa-solid fa-id-card"></i> Student Details</span>
        <button class="modal-close" onclick="document.getElementById('studentModal').style.display='none'">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const loggedInTeacher = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || "Teacher";

    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = [];

    window.onload = () => {
      setQuickDate(0);
      toggleStream();
    };

    function setQuickDate(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const localDate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      document.getElementById('attDate').value = localDate;
    }

    function toggleStream() {
      const clsNum = document.getElementById('attClass').value;
      document.getElementById('streamBox').style.display = (clsNum === '11' || clsNum === '12') ? 'flex' : 'none';
    }

    function extractNum(val) {
      if (!val) return '';
      const m = val.toString().match(/\d+/);
      return m ? m[0] : '';
    }

    function extractSec(d) {
      const raw = (d.section || d.sec || d.studentClass || d.class || '').toString().toUpperCase();
      const match = raw.match(/\b([A-D])\b/);
      return match ? match[1] : 'A';
    }

    function matchStream(d, targetStream) {
      if (targetStream === 'ALL' || targetStream === 'GENERAL') return true;
      const raw = (d.stream || d.curriculum || d.subject || '').toString().toUpperCase();
      if (!raw) return true;
      if (raw.includes(targetStream)) return true;
      if (targetStream === 'PCM' && (raw === 'SCIENCE' || raw.includes('PCM'))) return true;
      if (targetStream === 'PCB' && (raw === 'SCIENCE' || raw.includes('PCB'))) return true;
      if (targetStream === 'COMMERCE' && raw.includes('COMMERCE')) return true;
      if (targetStream === 'ARTS' && raw.includes('ARTS')) return true;
      return false;
    }

    async function loadList() {
      const date = document.getElementById('attDate').value;
      const selectedClassNum = extractNum(document.getElementById('attClass').value);
      const selectedSec = document.getElementById('attSection').value;
      const selectedStream = (selectedClassNum === '11' || selectedClassNum === '12') 
                             ? document.getElementById('attStream').value.trim().toUpperCase() 
                             : 'GENERAL';

      if (!date) return alert("कृपया तारीख चुनें!");

      const sheetCard = document.getElementById('sheetCard');
      sheetCard.style.display = 'block';

      document.getElementById('sheetTitle').innerHTML = `<i class="fa-solid fa-layer-group"></i> Class ${selectedClassNum}th ${selectedSec !== 'ALL' ? '- Sec ' + selectedSec : ''}`;
      document.getElementById('sheetDate').innerText = `Date: ${date}`;

      const container = document.getElementById('studentList');
      container.innerHTML = '<div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> डेटा लोड हो रहा है...</div>';

      const docId = `Class${selectedClassNum}_${selectedSec}_${selectedStream}_${date}`;
      let oldData = {};
      let hasOld = false;

      try {
        const snap = await db.collection('attendance').doc(docId).get();
        if (snap.exists && snap.data().students) {
          oldData = snap.data().students;
          hasOld = true;
        }
      } catch(e) {}

      document.getElementById('lockNotice').style.display = hasOld ? 'flex' : 'none';

      let rawUsers = [];
      try {
        const uSnap = await db.collection('users').get();
        uSnap.forEach(d => rawUsers.push({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error("Firestore read error:", err);
      }

      students = [];

      rawUsers.forEach(d => {
        const role = (d.role || d.user_role || '').toString().toLowerCase();
        if (role === 'teacher' || role === 'admin') return;

        const userClassStr = (d.studentClass || d.class || d.className || '').toString();
        const userClassNum = extractNum(userClassStr);
        if (userClassNum && userClassNum !== selectedClassNum) return;

        const userSec = extractSec(d);
        if (selectedSec !== 'ALL' && userSec !== selectedSec) return;

        if (selectedClassNum === '11' || selectedClassNum === '12') {
          if (!matchStream(d, selectedStream)) return;
        }

        const roll = parseInt(d.rollNo || d.rollNumber || d.roll || 0);
        const name = d.username || d.fullName || d.name || `Student ${roll || ''}`;
        const prevStatus = oldData[d.id] || oldData[d.email] || oldData[roll];

        const finalStatus = prevStatus ? prevStatus : '';
        const isLocked = (prevStatus === 'P');

        students.push({
          id: d.id,
          name: name,
          email: d.email || 'N/A',
          phone: d.phone || d.mobile || d.phoneNumber || 'N/A',
          gender: d.gender || 'N/A',
          class: `Class ${selectedClassNum}th`,
          section: userSec,
          stream: d.stream || selectedStream,
          roll: roll,
          status: finalStatus,
          locked: isLocked
        });
      });

      if (students.length === 0) {
        container.innerHTML = `
          <div class="no-data">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 18px; color: #f87171; margin-bottom: 4px; display: block;"></i>
            कोई छात्र नहीं मिला।
          </div>
        `;
        calc();
        return;
      }

      students.sort((a, b) => {
        if (a.section === b.section) return a.roll - b.roll;
        return a.section.localeCompare(b.section);
      });

      render();
    }

    function render() {
      const container = document.getElementById('studentList');
      container.innerHTML = '';

      students.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'student-item';

        let toggleHtml = '';
        if (s.locked) {
          toggleHtml = `
            <div class="locked-badge" title="Locked (Already Present)">
              <i class="fa-solid fa-lock"></i> P
            </div>
          `;
        } else {
          toggleHtml = `
            <div class="toggle-group">
              <button class="toggle-btn ${s.status === 'P' ? 'active-p' : ''}" onclick="toggleSt(${idx},'P')">P</button>
              <button class="toggle-btn ${s.status === 'A' ? 'active-a' : ''}" onclick="toggleSt(${idx},'A')">A</button>
              <button class="toggle-btn ${s.status === 'L' ? 'active-l' : ''}" onclick="toggleSt(${idx},'L')">L</button>
            </div>
          `;
        }

        div.innerHTML = `
          <div class="student-info" onclick="showInfo(${idx})">
            <span class="roll-badge">${s.roll < 10 ? '0' + s.roll : s.roll}</span>
            <span class="sec-badge">Sec ${s.section}</span>
            <span class="student-name">${s.name}</span>
            <i class="fa-solid fa-circle-info btn-info-icon"></i>
          </div>
          ${toggleHtml}
        `;
        container.appendChild(div);
      });

      calc();
    }

    function toggleSt(idx, st) {
      if (students[idx].locked) return;
      students[idx].status = (students[idx].status === st) ? '' : st;
      render();
    }

    function markRemaining(st) {
      students.forEach(s => {
        if (!s.locked && !s.status) {
          s.status = st;
        }
      });
      render();
    }

    function resetToGeneral() {
      students.forEach(s => {
        if (!s.locked) s.status = '';
      });
      render();
    }

    function calc() {
      const total = students.length;
      const p = students.filter(s => s.status === 'P').length;
      const a = students.filter(s => s.status === 'A').length;
      const unset = students.filter(s => !s.status).length;

      document.getElementById('stTotal').innerText = total;
      document.getElementById('stP').innerText = p;
      document.getElementById('stA').innerText = a;
      document.getElementById('stUnset').innerText = unset;
    }

    function showInfo(idx) {
      const s = students[idx];
      let displayStatus = 'General (Unmarked)';
      if (s.status === 'P') displayStatus = 'Present';
      else if (s.status === 'A') displayStatus = 'Absent';
      else if (s.status === 'L') displayStatus = 'Leave';

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-row"><span>Full Name</span><b style="color:#38bdf8">${s.name}</b></div>
        <div class="detail-row"><span>Roll Number</span><b>${s.roll}</b></div>
        <div class="detail-row"><span>Class & Sec</span><b>${s.class} (Sec ${s.section})</b></div>
        <div class="detail-row"><span>Status</span><b>${displayStatus}</b></div>
        <div class="detail-row" style="background: rgba(56, 189, 248, 0.08); padding: 6px; border-radius: 6px; margin-top: 5px;">
          <span>Email</span>
          <b>${s.email} ${s.email !== 'N/A' ? `<button class="copy-tag" onclick="copy('${s.email}')">Copy</button>` : ''}</b>
        </div>
      `;
      document.getElementById('studentModal').style.display = 'flex';
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      alert("✅ Copied: " + text);
    }

    function copyAllEmails() {
      const list = students.map(s => s.email).filter(e => e && e !== 'N/A');
      if (!list.length) return alert("कोई ईमेल नहीं मिला!");
      navigator.clipboard.writeText(list.join(', '));
      alert(`✅ ${list.length} छात्रों के ईमेल कॉपी हो गए!`);
    }

    async function saveRecord() {
      const date = document.getElementById('attDate').value;
      const selectedClassNum = extractNum(document.getElementById('attClass').value);
      const selectedSec = document.getElementById('attSection').value;
      const selectedStream = (selectedClassNum === '11' || selectedClassNum === '12') 
                             ? document.getElementById('attStream').value 
                             : 'General';

      if (!students.length) return alert("छात्र लिस्ट खाली है!");

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; 
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

      const map = {};
      students.forEach(s => {
        if (s.status) {
          map[s.id] = s.status;
          if (s.email && s.email !== 'N/A') map[s.email] = s.status;
          if (s.roll) map[s.roll] = s.status;
        }
      });

      const p = students.filter(s => s.status === 'P').length;
      const a = students.filter(s => s.status === 'A').length;
      const l = students.filter(s => s.status === 'L').length;

      const docId = `Class${selectedClassNum}_${selectedSec}_${selectedStream}_${date}`;

      try {
        await db.collection('attendance').doc(docId).set({
          date, 
          class: `Class ${selectedClassNum}th`, 
          section: selectedSec, 
          stream: selectedStream,
          teacher: loggedInTeacher,
          total: students.length, 
          present: p,
          absent: a,
          leave: l,
          percentage: students.length ? Math.round((p / students.length) * 100) : 0,
          students: map,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("✅ अटेंडेंस सफलतापूर्वक सेव हो गई!");
        loadList();
      } catch(e) {
        console.error("Save error:", e);
        alert("अटेंडेंस सेव करने में त्रुटि हुई!");
      }

      btn.disabled = false; 
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save & Submit Attendance';
    }
  </script>
</body>
</html>
