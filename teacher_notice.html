<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Notice Portal - SSKL Agrawal Memorial Bal Vidhya Mandir</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    /* Hardware Accelerated Smooth Background */
    body { 
      background-color: #070d19;
      min-height: 100vh; 
      color: #ffffff; 
      overflow-x: hidden;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #070d19 0%, #0f172a 50%, #1e293b 100%);
      z-index: -1;
      transform: translateZ(0);
    }

    .container {
      width: 100%;
      max-width: 900px;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Fixed Clean Header (No Overlap on Mobile) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.75);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 22px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      gap: 12px;
      transform: translateZ(0);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.25;
      min-width: 0;
    }

    .brand i {
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand span {
      white-space: normal;
      word-break: keep-all;
    }

    .btn-dashboard {
      text-decoration: none;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-dashboard:hover {
      background: rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }

    /* Optimized Form Card */
    .form-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 26px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transform: translateZ(0);
    }

    .form-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 13px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }

    .form-textarea {
      resize: vertical;
      min-height: 85px;
    }

    .file-hint {
      font-size: 11px;
      color: #fbbf24;
      margin-top: 4px;
    }

    .btn-publish {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 8px;
    }

    .btn-publish:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }

    /* List Section */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .notice-card {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 5px solid #38bdf8;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      transform: translateZ(0);
    }

    .notice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 12px;
    }

    .notice-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .notice-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-urgent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-exam { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-holiday { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-sports { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-general { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    .badge-info { background: rgba(255, 255, 255, 0.08); color: #94a3b8; }

    .notice-desc {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .notice-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      transition: background 0.2s ease;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .no-data {
      text-align: center;
      padding: 26px;
      color: #94a3b8;
      font-size: 13px;
    }

    /* Responsive Mobile Fine-Tuning */
    @media (max-width: 480px) {
      .top-bar {
        padding: 12px 14px;
      }
      .brand {
        font-size: 13.5px;
        gap: 8px;
      }
      .brand i {
        font-size: 16px;
      }
      .btn-dashboard {
        padding: 6px 10px;
        font-size: 11px;
      }
      .form-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-bullhorn"></i>
        <span>Teacher Notice Management</span>
      </div>
      <a href="teacher_dashboard.html" class="btn-dashboard">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
    </div>

    <!-- Create Notice Form -->
    <div class="form-card">
      <div class="form-title">
        <i class="fa-solid fa-pen-to-square"></i> Publish New Notice
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label>Notice Title *</label>
          <input type="text" id="noticeTitle" class="form-input" placeholder="e.g., Annual Sports Meet 2026">
        </div>

        <div class="input-group">
          <label>Category / Badge *</label>
          <select id="noticeType" class="form-select">
            <option value="GENERAL">General Notice</option>
            <option value="URGENT">🔴 Urgent</option>
            <option value="EXAM">🔵 Exam</option>
            <option value="HOLIDAY">🟡 Holiday</option>
            <option value="SPORTS">🟢 Sports</option>
          </select>
        </div>

        <div class="input-group">
          <label>Target Class *</label>
          <select id="noticeClass" class="form-select">
            <option value="All">All Classes</option>
            <option value="Class 9th">Class 9th</option>
            <option value="Class 10th">Class 10th</option>
            <option value="Class 11th">Class 11th</option>
            <option value="Class 12th">Class 12th</option>
          </select>
        </div>

        <div class="input-group">
          <label>Target Stream *</label>
          <select id="noticeStream" class="form-select">
            <option value="All">All Streams / General</option>
            <option value="PCM">PCM</option>
            <option value="PCB">PCB</option>
            <option value="Commerce">Commerce</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <div class="input-group" style="margin-bottom: 14px;">
        <label>Notice Content / Instructions *</label>
        <textarea id="noticeDescription" class="form-textarea" placeholder="Write full details about the notice here..."></textarea>
      </div>

      <div class="input-group" style="margin-bottom: 14px;">
        <label>Attach Document PDF (Optional)</label>
        <input type="file" id="noticeFile" accept="application/pdf" class="form-input">
        <div class="file-hint"><i class="fa-solid fa-triangle-exclamation"></i> Max allowed file size: 1.5 MB</div>
      </div>

      <button id="publishBtn" class="btn-publish" onclick="publishNotice()">
        <i class="fa-solid fa-paper-plane"></i> Publish Notice
      </button>
    </div>

    <!-- Published Notices List -->
    <div class="section-title">
      <i class="fa-solid fa-list-check"></i> Previously Published Notices
    </div>

    <div id="teacherNoticesContainer">
      <div class="no-data">Loading published notices...</div>
    </div>

    <!-- See More Pagination -->
    <div style="text-align: center; margin: 22px 0;">
      <button id="seeMoreBtn" onclick="loadMoreNotices()" style="display: none; padding: 10px 24px; background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.25s; font-size: 13px;">
        <i class="fa-solid fa-chevron-down"></i> See More Notices
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const loggedInTeacher = localStorage.getItem('loggedInTeacher') || localStorage.getItem('loggedInUser') || "School Administration";

    const firebaseConfig = {
      apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
      authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
      projectId: "ss-kanhaiyalal-agrawal",
      storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
      messagingSenderId: "776171239833",
      appId: "1:776171239833:web:39eea44420db97384b3b08",
      measurementId: "G-TQKTRTKBEJ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let lastNoticeDoc = null;
    let hasMoreNotices = true;
    let myNoticesData = [];

    async function publishNotice() {
      const title = document.getElementById('noticeTitle').value.trim();
      const type = document.getElementById('noticeType').value;
      const targetClass = document.getElementById('noticeClass').value;
      const targetStream = document.getElementById('noticeStream').value;
      const description = document.getElementById('noticeDescription').value.trim();
      const fileInput = document.getElementById('noticeFile');

      if (!title || !description) {
        alert("Please fill both Title and Description!");
        return;
      }

      let attachmentObj = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const maxBytes = 1.5 * 1024 * 1024;

        if (file.size > maxBytes) {
          alert("⚠️ File size exceeds 1.5 MB limit!");
          return;
        }

        try {
          const base64Url = await convertBase64(file);
          attachmentObj = {
            name: file.name,
            size: (file.size / 1024).toFixed(1) + " KB",
            url: base64Url
          };
        } catch (err) {
          alert("Error processing file!");
          return;
        }
      }

      const publishBtn = document.getElementById('publishBtn');
      publishBtn.disabled = true;
      publishBtn.innerText = "Publishing...";

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

      const newNotice = {
        title: title,
        type: type,
        class: targetClass,
        stream: targetStream,
        description: description,
        author: loggedInTeacher,
        date: dateStr,
        time: timeStr,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        isNew: true,
        attachment: attachmentObj
      };

      db.collection('notices').add(newNotice).then(() => {
        alert("Notice published successfully!");
        
        document.getElementById('noticeTitle').value = '';
        document.getElementById('noticeDescription').value = '';
        document.getElementById('noticeFile').value = '';
        publishBtn.disabled = false;
        publishBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Notice';

        loadInitialNotices();
      }).catch((err) => {
        console.error("Notice save error:", err);
        alert("Error publishing notice!");
        publishBtn.disabled = false;
        publishBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Notice';
      });
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }

    function loadInitialNotices() {
      myNoticesData = [];
      lastNoticeDoc = null;
      hasMoreNotices = true;
      fetchNoticesBatch(false);
    }

    function fetchNoticesBatch(isAppend = false) {
      let query = db.collection('notices').orderBy('createdAt', 'desc');

      if (isAppend && lastNoticeDoc) {
        query = query.startAfter(lastNoticeDoc);
      }

      query.limit(5).get().then((snapshot) => {
        if (snapshot.empty) {
          hasMoreNotices = false;
          updateSeeMoreButton();
          if (!isAppend && myNoticesData.length === 0) {
            renderNoticesList();
          }
          return;
        }

        lastNoticeDoc = snapshot.docs[snapshot.docs.length - 1];

        if (snapshot.docs.length < 5) {
          hasMoreNotices = false;
        }

        snapshot.forEach((doc) => {
          if (!myNoticesData.some(n => n.id === doc.id)) {
            myNoticesData.push({
              id: doc.id,
              ...doc.data()
            });
          }
        });

        renderNoticesList();
        updateSeeMoreButton();
      }).catch((err) => {
        console.error("Error loading notices:", err);
      });
    }

    function loadMoreNotices() {
      if (hasMoreNotices) {
        fetchNoticesBatch(true);
      }
    }

    function updateSeeMoreButton() {
      const btn = document.getElementById('seeMoreBtn');
      if (!btn) return;
      btn.style.display = hasMoreNotices ? 'inline-block' : 'none';
    }

    function renderNoticesList() {
      const container = document.getElementById('teacherNoticesContainer');
      if (!container) return;

      if (myNoticesData.length === 0) {
        container.innerHTML = `<div class="no-data">No notices published yet.</div>`;
        return;
      }

      container.innerHTML = '';

      myNoticesData.forEach((notice) => {
        const badgeClass = `badge-${(notice.type || 'general').toLowerCase()}`;

        const card = document.createElement('div');
        card.className = 'notice-card';

        card.innerHTML = `
          <div class="notice-header">
            <div class="notice-title">${notice.title}</div>
            <button class="btn-delete" onclick="deleteNotice('${notice.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
          <div class="notice-meta">
            <span class="badge ${badgeClass}">${notice.type || 'GENERAL'}</span>
            <span class="badge badge-info"><i class="fa-solid fa-users"></i> ${notice.class || 'All'} (${notice.stream || 'All'})</span>
            <span class="badge badge-info"><i class="fa-regular fa-calendar"></i> ${notice.date || ''}</span>
          </div>
          <div class="notice-desc">${notice.description}</div>
          <div class="notice-footer">
            <span>By: ${notice.author || 'Teacher'}</span>
            ${notice.attachment ? `<a href="${notice.attachment.url}" target="_blank" style="color:#38bdf8; text-decoration:none;"><i class="fa-solid fa-file-pdf"></i> View PDF (${notice.attachment.size})</a>` : '<span>No File Attached</span>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function deleteNotice(id) {
      if (confirm("Are you sure you want to delete this notice?")) {
        db.collection('notices').doc(id).delete().then(() => {
          alert("Notice deleted successfully!");
          loadInitialNotices();
        }).catch((err) => console.error("Error deleting notice:", err));
      }
    }

    window.onload = loadInitialNotices;
  </script>
</body>
</html>
