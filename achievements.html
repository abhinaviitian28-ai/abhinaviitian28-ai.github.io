<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements & Ranks - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 15px; 
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 18px; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px; 
            font-weight: 600;
            color: #38bdf8;
        }

        .brand i {
            background: rgba(56, 189, 248, 0.1);
            padding: 8px; 
            border-radius: 8px;
            color: #38bdf8;
            font-size: 15px;
        }

        .btn-dashboard {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 7px 14px; 
            border-radius: 8px;
            font-size: 13px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #475569;
        }

        .btn-dashboard:hover {
            background: #475569;
            color: #ffffff;
        }

        /* Clean Card Sections */
        .section-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        /* Sleek Minimal My Rank Card */
        .my-rank-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px 18px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .my-rank-left h3 {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 2px;
        }

        .my-rank-left p {
            font-size: 12px;
            color: #94a3b8;
        }

        .rank-pill {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* Clean Top 5 Leaderboard */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .leaderboard-item:hover {
            border-color: #475569;
        }

        .student-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-badge-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .rank-1 { background: rgba(234, 179, 8, 0.15); border-color: rgba(234, 179, 8, 0.4); color: #facc15; }
        .rank-2 { background: rgba(203, 213, 225, 0.15); border-color: rgba(203, 213, 225, 0.4); color: #cbd5e1; }
        .rank-3 { background: rgba(249, 115, 22, 0.15); border-color: rgba(249, 115, 22, 0.4); color: #fb923c; }

        .student-name-text {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }

        .student-meta-text {
            font-size: 11px;
            color: #94a3b8;
        }

        .student-percentage {
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        /* Horizontal Scrollable Feedback Cards */
        .feedback-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            min-height: 120px;
        }

        .feedback-scroll-container::-webkit-scrollbar {
            height: 6px;
        }
        .feedback-scroll-container::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 3px;
        }
        .feedback-scroll-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        .feedback-card {
            min-width: 280px;
            max-width: 300px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            flex-shrink: 0;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .feedback-card:hover {
            border-color: #475569;
        }

        .feedback-card.general {
            border-left: 3px solid #38bdf8;
        }

        .feedback-card.personal {
            border-left: 3px solid #22c55e;
        }

        .feedback-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: #38bdf8;
        }

        .feedback-card.personal .feedback-card-header {
            color: #22c55e;
        }

        .feedback-card-body {
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .no-data {
            color: #64748b;
            font-size: 13px;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .my-rank-box { flex-direction: column; align-items: flex-start; gap: 10px; }
            .rank-pill { align-self: flex-start; }
            .feedback-card { min-width: 260px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-award"></i>
                <span>Achievements & Ranks</span>
            </div>
            <a href="database.html" class="btn-dashboard">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <div class="section-card">
            <div class="section-title">
                <i class="fa-solid fa-user-graduate"></i> Your Standing
            </div>
            <div class="my-rank-box">
                <div class="my-rank-left">
                    <h3 id="studentNameDisplay">Loading...</h3>
                    <p>Class & Stream: <span id="classStreamDisplay" style="color:#38bdf8;">Loading...</span></p>
                </div>
                <div class="rank-pill" id="myRankPill">
                    <i class="fa-solid fa-ranking-star"></i> Rank --
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                <i class="fa-solid fa-trophy"></i> Top 5 Class Leaderboard
            </div>
            <div class="leaderboard-list" id="leaderboardListContainer">
                <div class="no-data">Loading Leaderboard...</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                <i class="fa-solid fa-comments"></i> Teachers' Remarks & Feedback
            </div>
            
            <div class="feedback-scroll-container" id="feedbackContainer">
                <div class="no-data">Loading Feedbacks...</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Check Login Session and Connectivity with database.html / index.html
        const loggedInUser = localStorage.getItem('loggedInUser');
        const userEmail = localStorage.getItem('user_email');

        if (!loggedInUser) {
            window.location.href = 'index.html';
        }

        // Display user name immediately from local storage
        document.getElementById('studentNameDisplay').innerText = loggedInUser;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08",
            measurementId: "G-TQKTRTKBEJ"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Fetch Real Student Data and Top 5 Leaderboard from Firestore
        async function loadStudentDataAndLeaderboard() {
            try {
                let studentClass = "12th";
                let studentStream = "Science";

                const studentsRef = db.collection('students');
                
                let querySnapshot = await studentsRef.where('name', '==', loggedInUser).get();
                if (querySnapshot.empty && userEmail) {
                    querySnapshot = await studentsRef.where('email', '==', userEmail).get();
                }

                if (!querySnapshot.empty) {
                    const studentDoc = querySnapshot.docs[0].data();
                    studentClass = studentDoc.class || studentClass;
                    studentStream = studentDoc.stream || studentStream;
                    const myRank = studentDoc.rank || 'N/A';
                    
                    document.getElementById('classStreamDisplay').innerText = `${studentClass} - ${studentStream}`;
                    document.getElementById('myRankPill').innerHTML = `<i class="fa-solid fa-ranking-star"></i> Rank #${myRank}`;
                } else {
                    document.getElementById('classStreamDisplay').innerText = "Class Record Pending";
                    document.getElementById('myRankPill').innerHTML = `<i class="fa-solid fa-ranking-star"></i> Rank --`;
                }

                const leaderboardContainer = document.getElementById('leaderboardListContainer');
                
                const top5Query = await studentsRef
                    .where('class', '==', studentClass)
                    .where('stream', '==', studentStream)
                    .orderBy('rank', 'asc')
                    .limit(5)
                    .get();

                if (top5Query.empty) {
                    leaderboardContainer.innerHTML = `<div class="no-data">No leaderboard records updated by teacher yet.</div>`;
                    return;
                }

                leaderboardContainer.innerHTML = '';
                let position = 1;

                top5Query.forEach(doc => {
                    const data = doc.data();
                    const isMe = (data.name === loggedInUser);
                    
                    let iconHtml = '';
                    let itemStyle = '';
                    
                    if (position === 1) {
                        iconHtml = `<div class="rank-badge-icon rank-1"><i class="fa-solid fa-trophy"></i></div>`;
                    } else if (position === 2) {
                        iconHtml = `<div class="rank-badge-icon rank-2"><i class="fa-solid fa-award"></i></div>`;
                    } else if (position === 3) {
                        iconHtml = `<div class="rank-badge-icon rank-3"><i class="fa-solid fa-medal"></i></div>`;
                    } else {
                        iconHtml = `<div class="rank-badge-icon">${position}</div>`;
                    }

                    if (isMe) {
                        itemStyle = `border-color: #38bdf8; background: rgba(56, 189, 248, 0.05);`;
                    }

                    const displayName = isMe ? `${data.name} (You)` : data.name;
                    const scoreText = data.score ? `${data.score}%` : (data.marks ? `${data.marks} Marks` : `Rank #${data.rank || position}`);

                    const itemHTML = `
                        <div class="leaderboard-item" style="${itemStyle}">
                            <div class="student-main">
                                ${iconHtml}
                                <div>
                                    <div class="student-name-text">${displayName}</div>
                                    <div class="student-meta-text">Roll No: ${data.rollNo || data.roll || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="student-percentage">${scoreText}</div>
                        </div>
                    `;
                    leaderboardContainer.innerHTML += itemHTML;
                    position++;
                });

            } catch (err) {
                console.error("Error loading leaderboard:", err);
                document.getElementById('leaderboardListContainer').innerHTML = `<div class="no-data">Teacher has not published ranks yet or database connecting...</div>`;
            }
        }

        // Fetch Dynamic Teacher Feedbacks from Firestore
        async function loadTeacherFeedbacks() {
            const feedbackContainer = document.getElementById('feedbackContainer');
            try {
                const feedbackRef = db.collection('feedbacks');
                const fbSnapshot = await feedbackRef.orderBy('timestamp', 'desc').get();

                if (fbSnapshot.empty) {
                    feedbackContainer.innerHTML = `<div class="no-data">No feedback or remarks posted by teachers yet.</div>`;
                    return;
                }

                feedbackContainer.innerHTML = '';
                let count = 0;

                fbSnapshot.forEach(doc => {
                    const fb = doc.data();
                    const isGeneral = fb.type === 'general' || fb.target === 'class' || !fb.targetUser;
                    const isPersonalForMe = fb.targetUser === loggedInUser || fb.targetUser === userEmail;

                    if (isGeneral || isPersonalForMe) {
                        count++;
                        const cardType = isPersonalForMe ? 'personal' : 'general';
                        const headerTitle = isPersonalForMe ? 'Personal Remark' : (fb.title || 'Announcement');
                        const iconClass = isPersonalForMe ? 'fa-solid fa-user-pen' : 'fa-solid fa-bullhorn';
                        const teacherName = fb.teacherName || fb.teacher || 'Faculty Member';
                        const visibilityText = isPersonalForMe ? 'Visible to: Only You' : 'Visible to: Class';

                        const cardHTML = `
                            <div class="feedback-card ${cardType}">
                                <div>
                                    <div class="feedback-card-header">
                                        <span><i class="${iconClass}"></i> ${headerTitle}</span>
                                        <span>${teacherName}</span>
                                    </div>
                                    <div class="feedback-card-body">
                                        "${fb.message || fb.text || ''}"
                                    </div>
                                </div>
                                <div style="font-size: 10px; color: #64748b; margin-top: 10px; border-top: 1px solid #334155; padding-top: 6px;">
                                    ${visibilityText}
                                </div>
                            </div>
                        `;
                        feedbackContainer.innerHTML += cardHTML;
                    }
                });

                if (count === 0) {
                    feedbackContainer.innerHTML = `<div class="no-data">No active remarks for you currently.</div>`;
                }

            } catch (err) {
                console.error("Error loading feedbacks:", err);
                feedbackContainer.innerHTML = `<div class="no-data">Feedback system ready. Waiting for teacher updates.</div>`;
            }
        }

        // Run data loaders on page load
        window.onload = function() {
            loadStudentDataAndLeaderboard();
            loadTeacherFeedbacks();
        };
    </script>
</body>
</html>
