<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - SS KanhaiyaLal Agrawal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070d19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px 12px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070d19 75%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            animation: fadeInContainer 0.35s ease-out;
        }

        @keyframes fadeInContainer {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.75);
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            margin-bottom: 16px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.3px;
        }

        .brand i {
            background: rgba(56, 189, 248, 0.15);
            padding: 8px 10px;
            border-radius: 9px;
            color: #38bdf8;
            font-size: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .btn-dashboard {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-decoration: none;
            padding: 7px 13px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-dashboard:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }

        /* Info Badge Bar */
        .student-info-bar {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .student-info-bar b {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Search Bar */
        .controls-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            padding: 10px 14px 10px 38px;
            border-radius: 10px;
            font-size: 12.5px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 45px 20px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
        }

        .empty-state i {
            font-size: 38px;
            color: #38bdf8;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        .empty-state h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .empty-state p {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Assignment Cards List */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            animation: cardEntrance 0.3s ease-out;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: #38bdf8;
            flex-shrink: 0;
        }

        .sub-pill {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 7px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            margin-top: 3px;
            line-height: 1.3;
        }

        .card-date {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 4px 8px;
            border-radius: 7px;
            font-size: 11px;
            color: #fbbf24;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-preview {
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            padding-left: 2px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
            font-size: 11.5px;
            color: #94a3b8;
        }

        .publisher-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .publisher-info i {
            color: #38bdf8;
        }

        .read-more {
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 14px;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.35);
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .modal-header {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(30, 41, 59, 0.5);
        }

        .modal-title-area h2 {
            font-size: 16px;
            color: #f8fafc;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .modal-meta-area {
            display: flex;
            gap: 12px;
            font-size: 11.5px;
            color: #94a3b8;
        }

        .close-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .modal-body {
            padding: 18px;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.6;
            max-height: 55vh;
            overflow-y: auto;
        }
        
        .modal-body::-webkit-scrollbar { width: 4px; }
        .modal-body::-webkit-scrollbar-track { background: #0f172a; }
        .modal-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .modal-footer {
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-action {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 16px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .btn-action:hover {
            background: #0284c7;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .card-header {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
            .brand { font-size: 14.5px; }
            .btn-dashboard { font-size: 11.5px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-book-open"></i>
                <span>Assignments</span>
            </div>
            <a href="database.html" class="btn-dashboard">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <!-- Student Profile Status Pill -->
        <div class="student-info-bar">
            <span id="stInfoText"><i class="fa-solid fa-spinner fa-spin"></i> Detecting Profile...</span>
            <span id="stCountText"><b>0</b> Assignments</span>
        </div>

        <!-- Search Box -->
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search assignments by title, subject or teacher..." onkeyup="handleSearch()">
            </div>
        </div>

        <!-- Assignments Container -->
        <div class="list-container" id="assignmentsContainer">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <h3>Loading Assignments...</h3>
                <p>Fetching your classroom updates.</p>
            </div>
        </div>

        <!-- See More Button -->
        <div style="text-align: center; margin: 20px 0;">
            <button id="seeMoreAssignmentsBtn" onclick="loadMoreAssignments()" style="display: none; padding: 10px 22px; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.25s; font-size: 12.5px;">
                <i class="fa-solid fa-chevron-down"></i> See More Assignments
            </button>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="assignmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-area">
                    <h2 id="modalTitle">Assignment Title</h2>
                    <div class="modal-meta-area">
                        <span><i class="fa-solid fa-calendar"></i> Due: <span id="modalDate">Date</span></span>
                    </div>
                </div>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body" id="modalContent">
                Instructions and details will appear here...
            </div>
            <div class="modal-footer">
                <button class="btn-action" id="btnDownload" onclick="downloadAttachment()">
                    <i class="fa-solid fa-paperclip"></i> Open Attachment
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const rawUser = localStorage.getItem('loggedInUser') || localStorage.getItem('username') || '';
        const rawEmail = localStorage.getItem('user_email') || localStorage.getItem('loggedInEmail') || localStorage.getItem('userEmail') || '';

        const loggedInUser = rawUser.trim().toLowerCase();
        const userEmail = rawEmail.trim().toLowerCase();

        if (!loggedInUser && !userEmail) {
            window.location.href = 'index.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08",
            measurementId: "G-TQKTRTKBEJ"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let studentProfile = {
            class: "11",
            section: "B",
            stream: "PCM"
        };

        let allMatchedAssignments = [];
        let displayedAssignments = [];
        let searchQuery = "";
        let currentAttachmentUrl = "";
        let visibleCount = 5;

        const container = document.getElementById('assignmentsContainer');

        function cleanClassNum(val) {
            if (!val) return '11';
            const m = String(val).match(/\d+/);
            return m ? m[0] : String(val).trim();
        }

        function cleanSecName(val) {
            if (!val) return 'B';
            const raw = String(val).toUpperCase().trim();
            const m = raw.match(/\b([A-D])\b/);
            return m ? m[1] : (raw === 'ALL' ? 'ALL' : 'B');
        }

        function matchStreams(asStream, stuStream) {
            const a = (asStream || 'GENERAL').toUpperCase().trim();
            const s = (stuStream || 'PCM').toUpperCase().trim();

            if (a === 'ALL' || a === 'GENERAL' || s === 'ALL' || s === 'GENERAL') return true;
            if (a === s) return true;
            if ((a === 'PCM' || a === 'PCB') && s.includes('SCIENCE')) return true;
            if ((s === 'PCM' || s === 'PCB') && a.includes('SCIENCE')) return true;
            return a.includes(s) || s.includes(a);
        }

        async function initAssignmentPortal() {
            await fetchStudentProfile();
            listenAssignmentsLive();
        }
async function fetchStudentProfile() {
            try {
                let found = false;
                const usersSnap = await db.collection('users').get();
                usersSnap.forEach(doc => {
                    const data = doc.data();
                    const dEmail = (data.email || '').toLowerCase().trim();
                    const dName = (data.username || data.name || data.fullName || '').toLowerCase().trim();

                    if ((userEmail && (dEmail === userEmail || doc.id.toLowerCase() === userEmail)) || 
                        (loggedInUser && dName === loggedInUser)) {
                        studentProfile.class = cleanClassNum(data.studentClass || data.class || data.className || '11');
                        studentProfile.section = cleanSecName(data.section || data.sec || data.studentClass || 'B');
                        studentProfile.stream = (data.stream || data.curriculum || data.subject || 'PCM').toUpperCase();
                        found = true;
                    }
                });

                if (!found) {
                    const stuSnap = await db.collection('students').where('name', '==', rawUser).get();
                    if (!stuSnap.empty) {
                        const d = stuSnap.docs[0].data();
                        studentProfile.class = cleanClassNum(d.class || d.classSection || '11');
                        studentProfile.section = cleanSecName(d.section || d.sec || 'B');
                        studentProfile.stream = (d.stream || 'PCM').toUpperCase();
                    }
                }
            } catch (err) {
                console.warn("Using default profile fallback:", err);
            }

            document.getElementById('stInfoText').innerHTML = `<i class="fa-solid fa-circle-check" style="color:#38bdf8"></i> Class <b>${studentProfile.class}th (Sec ${studentProfile.section})</b> • ${studentProfile.stream}`;
        }

        function listenAssignmentsLive() {
            db.collection("assignments").onSnapshot((snapshot) => {
                allMatchedAssignments = [];

                if (snapshot.empty) {
                    renderList();
                    return;
                }

                snapshot.forEach(doc => {
                    const d = doc.data();

                    const asClass = cleanClassNum(d.classNum || d.class);
                    const myClass = cleanClassNum(studentProfile.class);

                    const asSec = cleanSecName(d.section || d.sec);
                    const mySec = cleanSecName(studentProfile.section);

                    const isClassMatch = (!asClass || asClass === 'ALL' || asClass === myClass);
                    const isSecMatch = (!asSec || asSec === 'ALL' || mySec === 'ALL' || asSec === mySec);
                    const isStreamMatch = matchStreams(d.stream, studentProfile.stream);

                    if (isClassMatch && isSecMatch && isStreamMatch) {
                        allMatchedAssignments.push({
                            id: doc.id,
                            title: d.title || 'Assignment',
                            subject: d.subject || 'General',
                            description: d.description || d.instructions || d.desc || d.content || 'No extra instructions provided.',
                            dueDate: d.dueDate || d.date || 'N/A',
                            teacherName: d.teacherName || d.teacher || 'Teacher',
                            link: d.link || d.attachmentUrl || d.fileUrl || '',
                            createdAt: d.createdAt
                        });
                    }
                });

                // Safe Sorting by creation date
                allMatchedAssignments.sort((a, b) => {
                    let timeA = a.createdAt ? (a.createdAt.seconds ? a.createdAt.seconds * 1000 : new Date(a.createdAt).getTime()) : 0;
                    let timeB = b.createdAt ? (b.createdAt.seconds ? b.createdAt.seconds * 1000 : new Date(b.createdAt).getTime()) : 0;
                    return timeB - timeA;
                });

                document.getElementById('stCountText').innerHTML = `<b>${allMatchedAssignments.length}</b> Assignments`;
                applyPaginationAndRender();
            }, (error) => {
                console.error("Firestore read error:", error);
                renderList();
            });
        }

        function applyPaginationAndRender() {
            displayedAssignments = allMatchedAssignments.slice(0, visibleCount);
            renderList();
            updateSeeMoreButton();
        }

        function loadMoreAssignments() {
            visibleCount += 5;
            applyPaginationAndRender();
        }

        function updateSeeMoreButton() {
            const btn = document.getElementById('seeMoreAssignmentsBtn');
            if (!btn) return;

            if (allMatchedAssignments.length > visibleCount && searchQuery === '') {
                btn.style.display = 'inline-block';
                btn.innerHTML = `<i class="fa-solid fa-chevron-down"></i> See More (${allMatchedAssignments.length - visibleCount} remaining)`;
            } else {
                btn.style.display = 'none';
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderList();
            updateSeeMoreButton();
        }

        function renderList() {
            container.innerHTML = "";

            let source = (searchQuery === '') ? displayedAssignments : allMatchedAssignments;

            let filtered = source.filter(item => {
                let textToSearch = `${item.title} ${item.subject} ${item.description} ${item.teacherName}`.toLowerCase();
                return textToSearch.includes(searchQuery);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-bell-slash"></i>
                        <h3>No Assignments Published Yet</h3>
                        <p>Aapki Class ke liye abhi koi assignment upload nahi hai.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                let displayDate = item.dueDate;
                try { 
                    if(displayDate && displayDate !== "N/A") {
                        displayDate = new Date(displayDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); 
                    }
                } catch(e){}

                const card = document.createElement('div');
                card.className = "card";
                card.onclick = () => openModal(item.id);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <i class="fa-solid fa-file-lines"></i>
                            </div>
                            <div>
                                <span class="sub-pill">${item.subject}</span>
                                <h3 class="card-title">${item.title}</h3>
                            </div>
                        </div>
                        <div class="card-date">
                            <i class="fa-solid fa-hourglass-half"></i> Due: ${displayDate}
                        </div>
                    </div>
                    <div class="card-preview">
                        ${item.description}
                    </div>
                    <div class="card-footer">
                        <div class="publisher-info">
                            <i class="fa-solid fa-user-pen"></i>
                            <span>${item.teacherName}</span>
                        </div>
                        <div class="read-more">
                            View Details <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            const item = allMatchedAssignments.find(a => a.id === id);
            if (!item) return;

            let displayDate = item.dueDate;
            try { 
                if(displayDate && displayDate !== "N/A") {
                    displayDate = new Date(displayDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); 
                }
            } catch(e){}

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDate').innerText = displayDate;
            document.getElementById('modalContent').innerHTML = `
                <div style="margin-bottom: 12px; display:flex; gap:8px; align-items:center;">
                    <span class="sub-pill">${item.subject}</span>
                    <span style="font-size: 11.5px; color: #94a3b8;"><i class="fa-solid fa-user-pen"></i> ${item.teacherName}</span>
                </div>
                <div style="line-height:1.6; white-space: pre-wrap;">${item.description}</div>
            `;
            
            currentAttachmentUrl = item.link || "";
            
            const btnDownload = document.getElementById('btnDownload');
            if (currentAttachmentUrl && currentAttachmentUrl.trim() !== "" && currentAttachmentUrl !== "#") {
                btnDownload.style.display = 'inline-flex';
            } else {
                btnDownload.style.display = 'none';
            }

            document.getElementById('assignmentModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('assignmentModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('assignmentModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function downloadAttachment() {
            if (currentAttachmentUrl && currentAttachmentUrl.trim() !== "" && currentAttachmentUrl !== "#") {
                window.open(currentAttachmentUrl, '_blank');
            } else {
                alert("No attachment file was provided by the teacher for this assignment.");
            }
        }

        document.addEventListener("DOMContentLoaded", initAssignmentPortal);
    </script>
</body>
</html>
