<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profiles & Gmail Manager - SSKL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // 🔒 LAYER 1 SECURITY GUARD
        (function enforceTeacherSecurity() {
            const loggedInUser = localStorage.getItem('loggedInUser');
            const userRole = localStorage.getItem('user_role');

            if (!loggedInUser || userRole !== 'teacher') {
                alert("🚫 Access Denied! Only teachers can access this portal.");
                window.location.href = 'database.html';
            }
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #070d19;
            background: linear-gradient(135deg, #070d19 0%, #0f172a 50%, #1e293b 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* Top Bar Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.75);
            padding: 16px 22px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-bottom: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            font-size: 22px;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.15);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Search & Filter Section */
        .search-card {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
        }

        .search-box {
            position: relative;
            flex: 2;
            min-width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #60a5fa;
        }

        .search-box input {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 16px 12px 42px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
        }

        .search-box input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.3);
        }

        .filter-select {
            flex: 1;
            min-width: 140px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* Students Grid */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .student-card {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .student-card:hover {
            transform: translateY(-4px);
            border-color: #60a5fa;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(96, 165, 250, 0.2);
        }

        .card-top-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .student-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar-male {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .avatar-female {
            background: rgba(244, 114, 182, 0.15);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .student-name-box h3 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .student-name-box p {
            font-size: 12px;
            color: #94a3b8;
        }

        .details-list {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
        }

        .detail-row span:first-child {
            color: #94a3b8;
            font-weight: 500;
        }

        .btn-edit-student {
            width: 100%;
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.35);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-edit-student:hover {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 13, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 18px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h3 {
            font-size: 17px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn-save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            flex: 1;
            cursor: pointer;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            flex: 1;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 40px;
            color: #60a5fa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-header">
            <div class="header-title">
                <i class="fa-solid fa-users-gear"></i>
                <h1>Student Profiles & Gmail Directory</h1>
            </div>
            <a href="teacher_dashboard.html" class="btn-back">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
        </div>

        <div class="search-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by Name, Roll No, or Gmail..." onkeyup="filterStudents()">
            </div>
            
            <select id="classFilter" class="filter-select" onchange="filterStudents()">
                <option value="All">All Classes</option>
                <option value="1st">Class 1st</option>
                <option value="2nd">Class 2nd</option>
                <option value="3rd">Class 3rd</option>
                <option value="4th">Class 4th</option>
                <option value="5th">Class 5th</option>
                <option value="6th">Class 6th</option>
                <option value="7th">Class 7th</option>
                <option value="8th">Class 8th</option>
                <option value="9th">Class 9th</option>
                <option value="10th">Class 10th</option>
                <option value="11th">Class 11th</option>
                <option value="12th">Class 12th</option>
            </select>
        </div>

        <div class="students-grid" id="studentsGrid">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading Registered Students...</p>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-pen" style="color: #60a5fa;"></i> Edit Student Profile</h3>
            </div>

            <input type="hidden" id="editingDocId">

            <div class="form-group">
                <label>Student Name (Registered)</label>
                <input type="text" id="editName" disabled style="opacity: 0.7;">
            </div>

            <div class="form-group">
                <label>Gmail / Email Address</label>
                <input type="email" id="editEmail" placeholder="student@gmail.com">
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Roll Number</label>
                    <input type="number" id="editRoll" min="1" max="150">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Gender</label>
                    <select id="editGender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Class</label>
                    <select id="editClass" onchange="handleClassChange()">
                        <option value="1st">1st</option>
                        <option value="2nd">2nd</option>
                        <option value="3rd">3rd</option>
                        <option value="4th">4th</option>
                        <option value="5th">5th</option>
                        <option value="6th">6th</option>
                        <option value="7th">7th</option>
                        <option value="8th">8th</option>
                        <option value="9th">9th</option>
                        <option value="10th">10th</option>
                        <option value="11th">11th</option>
                        <option value="12th">12th</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Section</label>
                    <select id="editSection">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Stream / Curriculum</label>
                <select id="editStream"></select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveStudentProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1mrLB5XX6KgDTHyEDEoOhujQWcXHsbn4",
            authDomain: "ss-kanhaiyalal-agrawal.firebaseapp.com",
            projectId: "ss-kanhaiyalal-agrawal",
            storageBucket: "ss-kanhaiyalal-agrawal.firebasestorage.app",
            messagingSenderId: "776171239833",
            appId: "1:776171239833:web:39eea44420db97384b3b08",
            measurementId: "G-TQKTRTKBEJ"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let allStudents = [];

        // Load Real-time Students
        function loadStudents() {
            db.collection("users").onSnapshot((snapshot) => {
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Exclude teachers from student directory
                    if (data.role !== 'teacher') {
                        allStudents.push({ id: doc.id, ...data });
                    }
                });

                // Check dashboard search query
                const savedQuery = localStorage.getItem('studentSearchQuery');
                if (savedQuery) {
                    document.getElementById('searchInput').value = savedQuery;
                    localStorage.removeItem('studentSearchQuery');
                }

                filterStudents();
            }, (error) => {
                console.error("Firestore error:", error);
            });
        }

        // Render & Filter Students List
        function filterStudents() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const classVal = document.getElementById('classFilter').value;
            const grid = document.getElementById('studentsGrid');

            grid.innerHTML = "";

            let filtered = allStudents.filter(st => {
                const nameMatch = (st.username || st.name || '').toLowerCase().includes(query);
                const rollMatch = (st.rollNo || '').toString().includes(query);
                const emailMatch = (st.email || st.id || '').toLowerCase().includes(query);

                const classMatch = (classVal === 'All') || (st.studentClass === classVal || st.class === classVal);

                return (nameMatch || rollMatch || emailMatch) && classMatch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-user-slash"></i>
                        <h3>No Students Found</h3>
                        <p>Search query ya class filter change karke dekhein.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(st => {
                const name = st.username || st.name || 'Student';
                const email = st.email || st.id || 'Not Set';
                const roll = st.rollNo || 'Not Set';
                const cls = st.studentClass || st.class || '10th';
                const sec = st.section || 'A';
                const gender = st.gender || 'Male';
                const stream = st.stream || 'General';

                const avatarIcon = gender === 'Female' ? '👩‍🎓' : '👨‍🎓';
                const avatarClass = gender === 'Female' ? 'avatar-female' : 'avatar-male';

                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="card-top-info">
                        <div class="student-avatar ${avatarClass}">${avatarIcon}</div>
                        <div class="student-name-box">
                            <h3>${name}</h3>
                            <p><i class="fa-solid fa-envelope"></i> ${email}</p>
                        </div>
                    </div>
                    <div class="details-list">
                        <div class="detail-row"><span>Roll No:</span> <span>${roll}</span></div>
                        <div class="detail-row"><span>Class & Sec:</span> <span>${cls} - ${sec}</span></div>
                        <div class="detail-row"><span>Gender:</span> <span>${gender}</span></div>
                        <div class="detail-row"><span>Stream:</span> <span>${stream}</span></div>
                    </div>
                    <button class="btn-edit-student" onclick="openEditModal('${st.id}')">
                        <i class="fa-solid fa-pen-to-square"></i> Edit Student Profile
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function handleClassChange() {
            const cls = document.getElementById('editClass').value;
            const streamSelect = document.getElementById('editStream');
            streamSelect.innerHTML = '';

            if (cls === '11th' || cls === '12th') {
                streamSelect.innerHTML = `
                    <option value="Science">Science</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Arts">Arts</option>
                `;
            } else {
                streamSelect.innerHTML = `
                    <option value="General / All Subjects">General / All Subjects</option>
                `;
            }
        }

        function openEditModal(docId) {
            const st = allStudents.find(s => s.id === docId);
            if (!st) return;

            document.getElementById('editingDocId').value = docId;
            document.getElementById('editName').value = st.username || st.name || '';
            document.getElementById('editEmail').value = st.email || st.id || '';
            document.getElementById('editRoll').value = st.rollNo || '';
            document.getElementById('editGender').value = st.gender || 'Male';
            document.getElementById('editClass').value = st.studentClass || st.class || '10th';
            document.getElementById('editSection').value = st.section || 'A';

            handleClassChange();
            if (st.stream) {
                document.getElementById('editStream').value = st.stream;
            }

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveStudentProfile() {
            const docId = document.getElementById('editingDocId').value;
            const email = document.getElementById('editEmail').value.trim();
            const roll = document.getElementById('editRoll').value;
            const gender = document.getElementById('editGender').value;
            const cls = document.getElementById('editClass').value;
            const sec = document.getElementById('editSection').value;
            const stream = document.getElementById('editStream').value;

            if (!roll || roll < 1 || roll > 150) {
                alert("Please enter a valid Roll Number between 1 and 150!");
                return;
            }

            db.collection("users").doc(docId).update({
                email: email,
                rollNo: roll.toString(),
                gender: gender,
                studentClass: cls,
                section: sec,
                stream: stream,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("✅ Student profile and Gmail updated successfully!");
                closeModal();
            }).catch(err => {
                console.error("Update error:", err);
                alert("Failed to update student profile!");
            });
        }

        window.onload = loadStudents;
    </script>
</body>
</html>
